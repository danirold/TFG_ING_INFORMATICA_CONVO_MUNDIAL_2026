<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Pantalla de elegir selección para la predicción</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Conectar una hoja de estilos (style.css) -->
    <link rel="stylesheet" href="/static/style.css">  
</head>

<body>
    
    <div class="contenedor-tarjeta" style="max-width: 1000px;">
        
        <div class="cabecera-tarjeta">
            <div class="adorno-bandera"></div>
            <h1>Paso 1: Elegir selección</h1>
            <p style="color: var(--texto-principal);"">Elige la selección nacional para la predicción.</p>
        </div>

        <div class="cuerpo-tarjeta" style="text-align: left;">
            <p style="color: var(--texto-principal); font-size: 0.95rem; margin-bottom: var(--espacio-md);">
                Actualmente, el modelo de IA está entrenado exclusivamente para predecir la convocatoria de la <strong>Selección Española</strong>.
            </p>

            <form id="formulario_seleccion" style="display: flex; flex-direction: column; gap: var(--espacio-md);">
                
                <!-- Sub-tarjeta rojita para la selección -->
                <div style="background-color: #FFF5F5; padding: var(--espacio-md); border-radius: var(--radio-md); border: 2px solid var(--rojo-españa);">
                    <label for="pais" style="font-weight: 600; font-size: 0.95rem; color: var(--texto-principal); display: block; margin-bottom: var(--espacio-sm);">
                        Selección Nacional:
                    </label>
                    <select id="pais" name="pais" style="width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: var(--radio-sm); font-family: var(--fuente-principal); font-size: 1rem; color: var(--texto-principal); background-color: var(--fondo-blanco);" required>
                        <option value="España" selected>España</option>
                    </select>
                </div>

                <div style="display: flex; flex-direction: column; gap: var(--espacio-sm); margin-top: var(--espacio-sm);">
                    <button type="submit" class="btn btn-exito btn-bloque">
                        Confirmar selección
                    </button>

                    <a href="/menu_principal" class="btn btn-ghost btn-bloque" style="text-align: center;">
                        Volver
                    </a>
                </div>
            </form>

            <p id="mensaje_respuesta" style="font-weight: 600; text-align: center; margin-top: var(--espacio-sm);"></p>
        </div>
        
    </div>

    <script src="/static/elegir_seleccion.js"></script>
    
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Pantalla del menú principal del administrador</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">  
</head>

<body>
    
    <div class="contenedor-tarjeta" style="max-width: 1000px;">
        
        <div class="cabecera-tarjeta">
            <div class="adorno-bandera"></div>
            <h1>Menú DE Administrador</h1>
            <p style="color: #333333; font-weight: 500;">Bienvenido, has iniciado sesión como administrador.</p>
        </div>

        <div class="cuerpo-tarjeta" style="text-align: left;">
            
            <div style="display: flex; flex-direction: column; gap: var(--espacio-md);">
                
                <!-- Botón 1: Gestionar BD (Blanco) -->
                <a href="/gestionar_bd_defecto" class="btn btn-ghost btn-bloque" style="text-align: center;">
                    Gestionar base de datos por defecto
                </a>

                <!-- Botón 2: Gestionar modelo (Blanco) -->
                <a href="/gestionar_modelo_pred" class="btn btn-ghost btn-bloque" style="text-align: center;">
                    Gestionar modelo predictivo
                </a>

                <!-- Separador visual -->
                <hr style="border: 0; border-top: 1px solid #CBD5E1; margin: var(--espacio-sm) 0;">

                <!-- Botón 3: Cerrar Sesión (Usamos la clase btn-peligro de siempre) -->
                <button id="boton_cerrar_sesion" type="button" class="btn btn-peligro btn-bloque">
                    Cerrar sesión
                </button>
                
            </div>

            <p id="mensaje_respuesta" style="font-weight: 600; text-align: center; margin-top: var(--espacio-md);"></p>

        </div>
    </div>

    <script src="/static/menu_principal_adm.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Pantalla de iniciar sesión de administrador</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    
    <div class="contenedor-tarjeta" style="max-width: 1000px;">
        
        <div class="cabecera-tarjeta">
            <!-- Mantenemos la bandera que te ha gustado -->
            <div class="adorno-bandera"></div>
            <h1>Iniciar Sesión Como Administrador</h1>
            <p style="color: #333333; font-weight: 500;">Introduce las credenciales de administrador para acceder al sistema.</p>
        </div>

        <div class="cuerpo-tarjeta" style="text-align: left;">
            
            <form id="formulario_inicio_sesion_admin" style="display: flex; flex-direction: column; gap: var(--espacio-md);">
                
                <div>
                    <label for="email" style="font-weight: 600; font-size: 0.95rem; color: #000000; display: block; margin-bottom: 4px;">Email administrador:</label>
                    <input type="email" id="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: var(--radio-sm); font-family: var(--fuente-principal); font-size: 0.95rem; color: #000000;">
                </div>

                <div>
                    <label for="contraseña" style="font-weight: 600; font-size: 0.95rem; color: #000000; display: block; margin-bottom: 4px;">Contraseña:</label>
                    <input type="password" id="contraseña" name="contraseña" required style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: var(--radio-sm); font-family: var(--fuente-principal); font-size: 0.95rem; color: #000000;">
                </div>

                <div style="margin-top: var(--espacio-sm);">
                    <button type="submit" class="btn btn-exito btn-bloque">
                        Iniciar sesión
                    </button>
                </div>
            </form>
            
            <p id="mensaje_respuesta" style="font-weight: 600; text-align: center; margin-top: var(--espacio-sm);"></p>

            <!-- Separador visual -->
            <div style="border-top: 1px solid #CBD5E1; margin: var(--espacio-lg) 0 var(--espacio-md) 0; padding-top: var(--espacio-md); text-align: center;">
                
                <div style="margin-top: var(--espacio-sm);">
                    <a href="/" class="btn btn-ghost btn-bloque" style="text-align: center; background-color: transparent; border-color: transparent; color: #333333; text-decoration: underline;">
                        Volver al inicio
                    </a>
                </div>

            </div>

        </div>
    </div>

    <script src="/static/iniciar_sesion_adm.js"></script>

</body>

</html>

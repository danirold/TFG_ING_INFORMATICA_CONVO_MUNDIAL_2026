<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Pantalla restablecer contraseña</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Actualizamos versión de CSS -->
    <link rel="stylesheet" href="/static/style.css">  
</head>

<body>
    
    <div class="contenedor-tarjeta" style="max-width: 1000px;">
        
        <div class="cabecera-tarjeta">
            <div class="adorno-bandera"></div>
            <h1>Restablecer Contraseña</h1>
            <p style="color: #333333; font-weight: 500;">Paso 2: Confirma la nueva contraseña para tu cuenta.</p>
        </div>

        <div class="cuerpo-tarjeta" style="text-align: left;">
            
            <form id="formulario_nueva_contra" style="display: flex; flex-direction: column; gap: var(--espacio-md);">
                
                <div>
                    <label for="email" style="font-weight: 600; font-size: 0.95rem; color: #000000; display: block; margin-bottom: 4px;">Email asociado:</label>
                    <input type="email" id="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: var(--radio-sm); font-family: var(--fuente-principal); font-size: 0.95rem; color: #000000;">
                </div>

                <div>
                    <label for="nueva_contraseña" style="font-weight: 600; font-size: 0.95rem; color: #000000; display: block; margin-bottom: 4px;">Nueva contraseña:</label>
                    <input type="password" id="nueva_contraseña" name="nueva_contraseña" required style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: var(--radio-sm); font-family: var(--fuente-principal); font-size: 0.95rem; color: #000000;">
                </div>

                <div>
                    <label for="nueva_contraseña_repetida" style="font-weight: 600; font-size: 0.95rem; color: #000000; display: block; margin-bottom: 4px;">Repetir nueva contraseña:</label>
                    <input type="password" id="nueva_contraseña_repetida" name="nueva_contraseña_repetida" required style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: var(--radio-sm); font-family: var(--fuente-principal); font-size: 0.95rem; color: #000000;">
                </div>

                <div style="margin-top: var(--espacio-sm);">
                    <!-- Botón VERDE para confirmar -->
                    <button type="submit" class="btn btn-exito btn-bloque">
                        Confirmar restablecimiento de contraseña
                    </button>
                </div>

            </form>

            <p id="mensaje_respuesta" style="font-weight: 600; text-align: center; margin-top: var(--espacio-sm);"></p>

            <!-- Separador visual y enlace para volver -->
            <div style="border-top: 1px solid #CBD5E1; margin: var(--espacio-lg) 0 var(--espacio-md) 0; padding-top: var(--espacio-md); text-align: center;">
                <a href="/iniciar_sesion" class="btn btn-ghost btn-bloque" style="text-align: center; background-color: transparent; border-color: transparent; color: #333333; text-decoration: underline;">
                    Cancelar y volver a iniciar sesión
                </a>
            </div>

        </div>
    </div>

    <script src="/static/restablecer_contra.js"></script>

</body>

</html>
